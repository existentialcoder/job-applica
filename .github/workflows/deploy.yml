name: Deploy

on:
  workflow_dispatch:
    inputs:
      backend:
        description: 'Backend'
        type: boolean
        default: false
      frontend:
        description: 'Frontend App'
        type: boolean
        default: false
      website:
        description: 'Website'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy-backend:
    name: Backend → VM
    runs-on: ubuntu-latest
    if: inputs.backend

    steps:
      - name: Deploy to VM
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
          TARGET: ${{ vars.VM_USER }}@${{ vars.VM_HOST }}
          BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          ssh "$TARGET" "set -e; cd /opt/job-applica \
            && git fetch --quiet origin '$BRANCH' && git checkout --quiet --detach FETCH_HEAD \
            && echo \"Deploying \$(git rev-parse --short HEAD)\" \
            && GIT_SHA=\$(git rev-parse --short HEAD) docker compose -f docker/docker-compose.prod.yml up -d --build --wait \
            && docker image prune -f"

  # ── Frontend → Cloudflare Pages ───────────────────────────────────────────────
  deploy-frontend:
    name: Frontend → CF Pages
    runs-on: ubuntu-latest
    if: inputs.frontend
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn workspace frontend build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CF_PAGES_PROJECT_FRONTEND }}
          directory: apps/frontend/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}

  # ── Website → Cloudflare Pages ────────────────────────────────────────────────
  deploy-website:
    name: Website → CF Pages
    runs-on: ubuntu-latest
    if: inputs.website
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Generate
        run: yarn workspace website generate

      - name: Deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CF_PAGES_PROJECT_WEBSITE }}
          directory: apps/website/.output/public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
