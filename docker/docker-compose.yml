services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: job_applica
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"  # web UI — view caught emails at http://localhost:8025
      - "1025:1025"  # SMTP — matches SMTP_HOST/SMTP_PORT default in apps/backend/.env

volumes:
  postgres_data:
    name: postgres_data
